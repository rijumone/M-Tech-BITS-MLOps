name: Build and Push Docker Image

on:
  push:
    branches:
      - develop  # Trigger on pushes to the `develop` branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: datlabs/ml-ops-ass-1
        tags: |
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64  # Specify platform while building

  upgrade-gke-cluster:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code to access files if needed.
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Install Google Cloud SDK
    - name: Setup Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        version: 'latest'  # Specify the desired version of gcloud
        credentials_json: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Authenticate gcloud
      run: |
          echo "Authenticating with gcloud"
          # write contents of GCP_SA_KEY to a file
          echo -e '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp_sa_key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp_sa_key.json

    - name: Configure GCP project
      run: |
          echo "Configuring GCP project"
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

    # Upgrade the GKE cluster (replace 'your-cluster' and 'your-zone' with your actual cluster name and zone)
    - name: Upgrade GKE Cluster
      run: |
        gcloud container clusters upgrade your-cluster \
            --zone your-zone \
            --cluster-version latest  # You can specify a specific version here if needed
