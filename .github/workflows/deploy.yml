name: Build and Push Docker Image

on:
  push:
    branches:
      - develop  # Trigger on pushes to the `develop` branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: datlabs/ml-ops-ass-1
        tags: |
          type=semver,pattern={{version}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64  # Specify platform while building

  upgrade-gke-cluster:
    runs-on: ubuntu-latest

    steps:
    # Checkout the code to access files if needed.
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Set up gcloud CLI
    - name: Set up gcloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}

    # Authenticate gcloud
    # - name: Authenticate gcloud
    #   run: gcloud auth activate-service-account --key-file=$GOOGLE_APPLICATION_CREDENTIALS
  

    - name: Configure GCP project
      run: |
          echo "Configuring GCP project"
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

    # Upgrade the GKE cluster
    - name: Upgrade GKE Cluster
      run: |
        gcloud container clusters upgrade mlops-ass-1-depl-0-cluster \
            --zone us-central1 \
            --cluster-version latest
